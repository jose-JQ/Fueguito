<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a0b07">
  <meta name="description" content="Un fueguito para Carito: te sigue con la mirada y te dice algo distinto en cada momento.">
  <title>Fueguito para Carito</title>
  <link rel="icon" href="https://res.cloudinary.com/damiqc1pj/image/upload/v1759803685/pixel-heart-2779422_960_720_k2chdr.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,460;0,9..144,560;1,9..144,460&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wash" aria-hidden="true">
    <span class="orb hearth"></span>
    <span class="orb rose"></span>
    <span class="orb gold"></span>
  </div>
  <div class="embers" id="embers" aria-hidden="true"></div>

  <main class="stage">
    <header class="dedication">
      <p class="eyebrow-label">un regalito</p>
      <h1>para Carito</h1>
    </header>

    <button type="button" class="buddy" id="buddy" aria-label="Fueguito. Tócalo.">
      <span class="glow" aria-hidden="true"></span>
      <span class="floor" aria-hidden="true"></span>
      <span class="fire" aria-hidden="true">
        <span class="fire-left">
          <span class="main-fire"></span>
          <span class="particle-fire"></span>
        </span>
        <span class="fire-center">
          <span class="main-fire"></span>
          <span class="particle-fire"></span>
        </span>
        <span class="fire-right">
          <span class="main-fire"></span>
          <span class="particle-fire"></span>
        </span>
        <span class="fire-bottom">
          <span class="main-fire"></span>
        </span>
        <span class="fire-core">
          <span class="main-fire"></span>
        </span>
      </span>
      <span class="face">
        <span class="eye-col left">
          <span class="eyebrow"></span>
          <span class="eye">
            <span class="pupil"><i class="shine"></i></span>
          </span>
          <span class="blush"></span>
        </span>
        <span class="mouth"></span>
        <span class="eye-col right">
          <span class="eyebrow"></span>
          <span class="eye">
            <span class="pupil"><i class="shine"></i></span>
          </span>
          <span class="blush"></span>
        </span>
      </span>
    </button>

    <section class="words" aria-label="Lo que dice el fueguito">
      <p class="moment" id="moment">recién encendido</p>
      <p class="phrase" id="phrase" aria-live="polite">Hola, Carito. Esta llamita se encendió pensando en ti.</p>
      <p class="whisper" id="whisper">Pasa el cursor, tócalo o quédate un ratito.</p>
    </section>

    <p class="sign">S + J = <span aria-hidden="true">♥</span><span class="sr-only">corazón</span></p>

    <div class="controls">
      <button type="button" class="pill" id="music-btn" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/></svg>
        <span id="music-label">poner canción</span>
      </button>
      <button type="button" class="pill" id="play-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5v11l9-5.5-9-5.5z"/></svg>
        <span>ver un recuerdito</span>
      </button>
    </div>
  </main>

  <div class="theater" id="theater" hidden>
    <button type="button" class="pill close-video" id="close-video">cerrar</button>
    <video id="main-video" controls playsinline>
      <source src="https://res.cloudinary.com/damiqc1pj/video/upload/v1769975546/Untitled_video_-_Made_with_Clipchamp_hweyze.mp4" type="video/mp4">
    </video>
    <p class="theater-note" id="theater-note"></p>
  </div>

  <audio id="bg-music" loop preload="none">
    <source src="https://res.cloudinary.com/damiqc1pj/video/upload/v1769975545/pie_pequeno_eljl6s.mp3" type="audio/mpeg">
  </audio>

  <script src="js/fueguito.js"></script>
</body>
</html>
