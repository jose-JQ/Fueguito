<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Un fueguito con sombrero de paja para Carito. Te sigue con la mirada y te dice algo distinto en cada momento.">
  <meta name="theme-color" content="#05080f">
  <title>Fueguito para Carito</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f0c36a' d='M4 20c2-1 6-1 8 1 1-6 6-10 8-14 2 5 6 8 8 14 2-1 5-1 7 0-1 6-7 10-15 10S5 26 4 20z'/%3E%3Cpath fill='%23ffb03a' d='M16 12c1 3 0 5 1 8 2-2 4 0 4 3a5 5 0 1 1-10 0c0-3 2-4 4-8 0 0 1 2 1-3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="stars"></span>
    <span class="horizon"></span>
  </div>

  <div class="embers" aria-hidden="true">
    <span style="--x:18%;--s:3px;--d:9s;--delay:-2s;--drift:-18px"></span>
    <span style="--x:32%;--s:2px;--d:12s;--delay:-7s;--drift:14px"></span>
    <span style="--x:46%;--s:4px;--d:8.5s;--delay:-4s;--drift:-10px"></span>
    <span style="--x:54%;--s:3px;--d:11s;--delay:-9s;--drift:20px"></span>
    <span style="--x:63%;--s:2px;--d:10s;--delay:-1s;--drift:-16px"></span>
    <span style="--x:74%;--s:3px;--d:13s;--delay:-6s;--drift:12px"></span>
    <span style="--x:84%;--s:2px;--d:9.5s;--delay:-3s;--drift:-8px"></span>
    <span style="--x:27%;--s:2px;--d:14s;--delay:-11s;--drift:22px"></span>
  </div>

  <div class="sea" aria-hidden="true">
    <svg viewBox="0 0 1440 160" preserveAspectRatio="none">
      <path fill="#07111c" d="M0 78Q180 28 360 78t360 0 360 0 360 0V160H0Z"/>
      <path fill="#0c1a2b" d="M0 98Q180 58 360 98t360 0 360 0 360 0V160H0Z"/>
      <path fill="#c5d7e6" opacity="0.16" d="M0 112Q180 92 360 112t360 0 360 0 360 0v10Q1260 108 1080 122t-360 0-360 0-360 0Z"/>
    </svg>
    <svg viewBox="0 0 1440 160" preserveAspectRatio="none">
      <path fill="#07111c" d="M0 78Q180 28 360 78t360 0 360 0 360 0V160H0Z"/>
      <path fill="#0c1a2b" d="M0 98Q180 58 360 98t360 0 360 0 360 0V160H0Z"/>
      <path fill="#c5d7e6" opacity="0.16" d="M0 112Q180 92 360 112t360 0 360 0 360 0v10Q1260 108 1080 122t-360 0-360 0-360 0Z"/>
    </svg>
  </div>

  <main class="stage">
    <header class="dedication">
      <p class="kicker">un viaje chiquito</p>
      <h1>para Carito</h1>
    </header>

    <button type="button" class="buddy" id="buddy" aria-label="Fueguito con sombrero de paja. Tócalo.">
      <span class="glow" aria-hidden="true"></span>
      <span class="flames" aria-hidden="true">
        <span class="tongue rear"></span>
        <span class="tongue left"></span>
        <span class="tongue right"></span>
        <span class="tongue body"></span>
        <span class="tongue core"></span>
      </span>
      <span class="face">
        <span class="eye-col left">
          <span class="brow"></span>
          <span class="eye"><span class="pupil"><i></i></span></span>
          <span class="blush"></span>
        </span>
        <span class="smile"></span>
        <span class="eye-col right">
          <span class="brow"></span>
          <span class="eye"><span class="pupil"><i></i></span></span>
          <span class="blush"></span>
        </span>
      </span>
      <svg class="hat" viewBox="0 0 340 170" aria-hidden="true">
        <ellipse cx="170" cy="66" rx="58" ry="54" fill="#c9842a"/>
        <ellipse cx="170" cy="62" rx="52" ry="48" fill="#f2c56b"/>
        <ellipse cx="170" cy="58" rx="44" ry="40" fill="#f8d78a"/>
        <ellipse cx="148" cy="42" rx="16" ry="9" fill="#fff6d2" opacity="0.85"/>
        <path d="M122 40c22-16 74-18 100 2" fill="none" stroke="#c9953c" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M114 58c24-18 90-20 116 2" fill="none" stroke="#d7a44a" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M118 78c22-14 84-16 108 0" fill="none" stroke="#c9953c" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M154 20c-6 30-2 62 6 92M188 22c4 28 2 58-4 88" fill="none" stroke="#e6bc6a" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
        <ellipse cx="170" cy="124" rx="156" ry="20" fill="#a56b22"/>
        <ellipse cx="170" cy="118" rx="156" ry="15" fill="#efc56a"/>
        <ellipse cx="170" cy="114" rx="118" ry="7" fill="#fbe7b4" opacity="0.55"/>
        <path d="M28 116c48-20 236-20 284 0" fill="none" stroke="#c48a34" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M50 124c42-12 198-12 240 0" fill="none" stroke="#f6e2b0" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
        <path d="M78 130c34-8 150-8 184 0" fill="none" stroke="#c9953c" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <path d="M170 104v26M118 112l-16 12M222 112l16 12M86 118l-12 8M254 118l12 8" fill="none" stroke="#d7a44a" stroke-width="1.15" stroke-linecap="round" opacity="0.7"/>
        <path d="M114 96c18 16 94 16 112 0-18 8-94 8-112 0z" fill="#d01212"/>
        <path d="M122 94c14 7 82 7 96 0" fill="none" stroke="#ff9a9a" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
        <path d="M120 102c-16 8-24 26-10 40" fill="none" stroke="#c01010" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="112" cy="144" r="3.4" fill="#c01010"/>
      </svg>
    </button>

    <section class="words" aria-label="Lo que dice el fueguito">
      <p class="moment" id="moment">te estaba esperando</p>
      <p class="phrase" id="phrase" aria-live="polite">Hola, Carito. Te amo, y esta llamita también.</p>
      <p class="whisper" id="whisper">Pasa el cursor, tócalo o quédate un ratito.</p>
      <button type="button" class="day-btn" id="day-btn">Frase del día</button>
    </section>

    <p class="sign">S + J <span aria-hidden="true">·</span> el tesoro eres tú</p>
  </main>

  <div class="day-modal" id="day-modal" hidden>
    <div class="day-card" role="dialog" aria-modal="true" aria-labelledby="day-kicker">
      <p class="day-kicker" id="day-kicker">frase del día</p>
      <p class="day-line" id="day-line"></p>
      <p class="day-for">para ti, Carito</p>
      <button type="button" class="day-close" id="day-close">cerrar</button>
    </div>
  </div>

  <script src="js/fueguito.js"></script>
</body>
</html>
